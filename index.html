<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q#2-JS Conditional Statements</title>

	<!--B5 SETUP-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<!-- JS SETUP -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<!-- CSS SETUP -->
	<link rel="stylesheet" type="text/css" href="style.css">

	<!-- ANIMATION SETUP -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

	<div class="container">
		<div class="header">
			<h1>Score Analyzer </h1>
		</div>

		<br>
		
		<details ontoggle="alert('Please input your grades in the folllowing subjects to get the average of the three.')">
			<summary>
				GUIDE
			</summary>
		</details>

		<br><hr>

		<div class="container2">
			<h3>English</h3>
			<form>
				<input type="number" id="englishgrade" placeholder="INPUT GRADE">
			</form>
			<br>
			

			<h3>Social Studies</h3>
			<form>
				<input type="number" id="ssgrade" placeholder="INPUT GRADE">
			</form>
			<br>
		

			<h3>Math</h3>
			<form>
				<input type="number" id="mathgrade" placeholder="INPUT GRADE">
			</form>
			<br>
		</div>

		<br><button type="button" class="btn btn-warning" id="checker" onClick="getFinalAverage()">CHECK</button><br><br>

		<h4>Final Average:</h4>
		<p id="checked"></p>

		<hr>

		<br><p><a href="https://knardo-9r.github.io/Q2EX2/">&#169; AY 2025 | ICT 9-Ruby | Kaitlyn Nardo</a></p>
	</div>

		
	<script>
		function getFinalAverage(){

			var sub1 = Number(document.getElementById('englishgrade').value);
			var sub2 = Number(document.getElementById('ssgrade').value);
			var sub3 = Number(document.getElementById('mathgrade').value);

			var finalavg = (sub1 + sub2 + sub3) /3; 

			document.getElementById('checked').innerHTML = finalavg.toFixed(2);

			if(finalavg >=94 && finalavg <=100){
				window.alert('Excellent!');
			}

			else if(finalavg >=87 && finalavg <=93.99){
				window.alert('Above standard.');
			}

			else if(finalavg >=80 && finalavg <=86.99){
				window.alert('Standard.');
			}

			else if(finalavg >=75 && finalavg <=79.99){
				window.alert('Room for improvement.');
			}

			else if(finalavg >=70 && finalavg <=74.99){
				window.alert('Poor.');
			}

			else if(finalavg <=69){
				window.alert('You will be scheduled a PTC.');
			}
		}
	</script>

</body>
</html>
